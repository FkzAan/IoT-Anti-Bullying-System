<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — Sentry Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Analytics</h1>
          <div class="sub">Incident trends and device reliability</div>
        </div>
      </div>

      <div class="chart-card">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Incidents per day (last 14 days)
        </h3>
        <canvas id="chart-incidents" height="90"></canvas>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="chart-card" style="margin-bottom:0;">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Sound detection frequency
          </h3>
          <canvas id="chart-sound" height="180"></canvas>
        </div>
        <div class="chart-card" style="margin-bottom:0;padding:0;overflow:hidden;">
          <div style="padding:22px 22px 0;">
            <h3 style="margin-bottom:12px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
              Device status
            </h3>
          </div>
          <table>
            <thead>
              <tr><th>Device</th><th>Status</th><th>Last contact</th></tr>
            </thead>
            <tbody id="uptime-body">
              <tr><td colspan="3" class="empty-state">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
