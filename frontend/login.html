<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Sentry Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  /* subtle grid lines in background */
  .login-wrap::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border-subtle) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: .4;
    pointer-events: none;
  }
  .login-card { position: relative; z-index: 1; }
  .login-divider { height: 1px; background: var(--border); margin: 20px 0 22px; }
  .login-tagline {
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 20px;
    letter-spacing: .03em;
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">

      <div class="brand">
        <div class="logo-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;color:var(--accent);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h1 style="font-size:17px;margin:0;">Sentry Admin</h1>
        </div>
      </div>

      <p class="sub">Anti-Bullying IoT Monitoring System</p>

      <div class="login-divider"></div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="Enter your username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <div class="error-text" id="error-text"></div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:4px;" id="submit-btn">
          Sign in
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <p class="login-tagline">Protected admin access — authorised personnel only</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
