<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Device Management — Sentry Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-container"></div>
    <main class="main">
      <div class="page-header">
        <div>
          <h1>Device Management</h1>
          <div class="sub">Register and manage ESP32-CAM sentry units</div>
        </div>
        <button class="btn btn-primary" id="add-device-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:13px;height:13px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Register device
        </button>
      </div>

      <div class="card" style="padding:0;overflow:hidden;">
        <table>
          <thead>
            <tr>
              <th>Device</th>
              <th>Device ID</th>
              <th>Location</th>
              <th>Status</th>
              <th>Last seen</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="devices-body">
            <tr><td colspan="6" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/devices.js"></script>
</body>
</html>
